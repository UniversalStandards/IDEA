components:
  schemas:
    File:
      type: object
      properties:
        name: {type: string}
        path: {type: string}
        content: {type: string, description: "Base64-encoded"}
        encoding: {type: string}
        size: {type: integer}
        sha: {type: string}
        download_url: {type: string}
        type: {type: string, enum: [file, dir]}

    Repo:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        full_name: {type: string}
        private: {type: boolean}
        html_url: {type: string}
        description: {type: string}
        default_branch: {type: string}
        clone_url: {type: string}
        language: {type: string}
        size: {type: integer}
        fork: {type: boolean}
        stargazers_count: {type: integer}
        watchers_count: {type: integer}
        forks_count: {type: integer}

    Issue:
      type: object
      properties:
        id: {type: integer}
        number: {type: integer}
        title: {type: string}
        body: {type: string}
        state: {type: string, enum: [open, closed]}
        user: {$ref: '#/components/schemas/User'}
        assignees: {type: array, items: {$ref: '#/components/schemas/User'}}
        labels: {type: array, items: {$ref: '#/components/schemas/Label'}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        html_url: {type: string}

    PR:
      type: object
      properties:
        id: {type: integer}
        number: {type: integer}
        title: {type: string}
        body: {type: string}
        state: {type: string, enum: [open, closed]}
        merged: {type: boolean}
        mergeable: {type: boolean}
        user: {$ref: '#/components/schemas/User'}
        head: {$ref: '#/components/schemas/Branch'}
        base: {$ref: '#/components/schemas/Branch'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        html_url: {type: string}

    Branch:
      type: object
      properties:
        name: {type: string}
        commit: {$ref: '#/components/schemas/Commit'}
        protected: {type: boolean}

    Commit:
      type: object
      properties:
        sha: {type: string}
        url: {type: string}
        author: {$ref: '#/components/schemas/User'}
        message: {type: string}

    User:
      type: object
      properties:
        id: {type: integer}
        login: {type: string}
        avatar_url: {type: string}
        html_url: {type: string}
        type: {type: string}

    Label:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        color: {type: string}
        description: {type: string}

    Comment:
      type: object
      properties:
        id: {type: integer}
        body: {type: string}
        user: {$ref: '#/components/schemas/User'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        html_url: {type: string}

    Review:
      type: object
      properties:
        id: {type: integer}
        user: {$ref: '#/components/schemas/User'}
        body: {type: string}
        state: {type: string, enum: [APPROVED, CHANGES_REQUESTED, COMMENTED]}
        submitted_at: {type: string, format: date-time}

    Error:
      type: object
      properties:
        message: {type: string}
        documentation_url: {type: string}
