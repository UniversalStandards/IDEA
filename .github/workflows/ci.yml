name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-frontend:
    name: Detect frontend
    runs-on: ubuntu-latest
    outputs:
      has_web: ${{ steps.detect.outputs.has_web }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for web/package.json
        id: detect
        run: |
          if [ -f web/package.json ]; then
            echo "has_web=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_web=false" >> "$GITHUB_OUTPUT"
            echo "No web/package.json found; frontend jobs will be skipped."
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:ci
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-that-is-32-characters-long!!
          ENCRYPTION_KEY: test-encryption-key-32-characters!!
      - name: Upload coverage
        if: matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify dist output
        run: test -f dist/index.js || (echo "dist/index.js missing" && exit 1)

  docker:
    name: Docker image (build + end-to-end smoke)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: universal-standard-mcp-server:ci
          build-args: |
            VERSION=0.1.0
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: stdio — stdout carries only JSON-RPC and the container exits on EOF
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 60 docker run -i --rm -e MCP_TRANSPORT=stdio universal-standard-mcp-server:ci > stdout.jsonl
          test "$(wc -l < stdout.jsonl)" -eq 2
          node -e 'const l=require("fs").readFileSync("stdout.jsonl","utf8").trim().split("\n").map(JSON.parse); if (l[1].result.tools.length !== 9) process.exit(1)'
      - name: stdio — discover, install (npm + PyPI), execute, uninstall
        run: |
          docker volume create hub-ci
          for tool in official:memory official:time; do
            docker run --rm -v hub-ci:/data --entrypoint node universal-standard-mcp-server:ci \
              /app/dist/cli/smoke.js --stdio --install "$tool" --approve
          done
      - name: HTTP — health, auth, and end-to-end flow over Streamable HTTP
        run: |
          TOKEN=$(openssl rand -hex 32)
          docker run -d --name hub-http -p 3000:3000 \
            -e MCP_AUTH_TOKEN="$TOKEN" -e JWT_SECRET="$(openssl rand -hex 32)" -e ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -e AUTO_APPROVE_TOOLS=official:memory universal-standard-mcp-server:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' hub-http)" = healthy ] && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' hub-http)" = healthy
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/mcp -H 'content-type: application/json' -d '{}')" = 401
          docker exec hub-http node /app/dist/cli/smoke.js --http http://127.0.0.1:3000/mcp --token "$TOKEN" --install official:memory
      - name: Container logs on failure
        if: failure()
        run: docker logs hub-http || true

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    needs: detect-frontend
    if: needs.detect-frontend.outputs.has_web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Run frontend typecheck
        run: npx tsc --noEmit
        working-directory: web

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    needs: detect-frontend
    if: needs.detect-frontend.outputs.has_web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Run frontend lint
        run: npm run lint
        working-directory: web

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    needs: detect-frontend
    if: needs.detect-frontend.outputs.has_web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Run frontend tests
        run: npm run test
        working-directory: web

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: detect-frontend
    if: needs.detect-frontend.outputs.has_web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Build frontend
        run: npm run build
        working-directory: web
      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-next-build
          path: web/.next/
          retention-days: 7

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    needs: [detect-frontend, frontend-build, build]
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && needs.detect-frontend.outputs.has_web == 'true'
    env:
      FRONTEND_PORT: '3000'
      BACKEND_PORT: '8080'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Build frontend for E2E
        run: npm run build
        working-directory: web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: web

      - name: Start backend
        run: PORT="$BACKEND_PORT" npm run dev > /tmp/backend.log 2>&1 & echo $! > /tmp/backend.pid

      - name: Start frontend
        run: npm run start -- --port "$FRONTEND_PORT" > /tmp/frontend.log 2>&1 & echo $! > /tmp/frontend.pid
        working-directory: web

      - name: Wait for services
        run: |
          for i in {1..60}; do
            frontend_ready=false
            backend_ready=false

            if curl -fsS "http://localhost:${FRONTEND_PORT}" >/dev/null; then
              frontend_ready=true
            fi

            if curl -fsS "http://localhost:${BACKEND_PORT}/health" >/dev/null; then
              backend_ready=true
            fi

            if [ "$frontend_ready" = "true" ] && [ "$backend_ready" = "true" ]; then
              exit 0
            fi

            echo "Waiting for services... frontend_ready=${frontend_ready} backend_ready=${backend_ready}"
            sleep 2
          done
          echo "Services did not become ready" >&2
          exit 1

      - name: Run frontend E2E tests
        run: npx playwright test
        working-directory: web

      - name: Upload E2E service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-service-logs
          path: |
            /tmp/backend.log
            /tmp/frontend.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          if [ -f /tmp/frontend.pid ]; then
            kill "$(cat /tmp/frontend.pid)" || true
          fi
          if [ -f /tmp/backend.pid ]; then
            kill "$(cat /tmp/backend.pid)" || true
          fi
