name: Feature Request
description: Propose a new capability for the Universal MCP Orchestration Hub
labels: ["enhancement"]
body:
  - type: input
    id: title
    attributes:
      label: Summary
      description: A short, descriptive title for the feature
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
    validations:
      required: false
