name: Bug Report
description: Report a defect in the Universal MCP Orchestration Hub
labels: ["bug", "triage"]
body:
  - type: input
    id: title
    attributes:
      label: Summary
      description: A short, descriptive title for the bug
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Numbered steps to reproduce the behavior
      placeholder: |
        1. Start the hub with `MCP_TRANSPORT=http`
        2. Send a request to ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      placeholder: "20.x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "macOS 14 / Ubuntu 22.04 / Windows 11"
    validations:
      required: true
  - type: input
    id: hub-version
    attributes:
      label: Hub Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste relevant log lines. Redact any secrets/tokens.
      render: shell
