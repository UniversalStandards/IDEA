# =============================================================================
# Universal Standard MCP Server — Docker Compose (production profile)
#
#   1. Generate secrets once:   ./scripts/generate-env.sh      (Linux/macOS)
#                               .\scripts\generate-env.ps1     (Windows)
#   2. Start:                   docker compose up -d --build
#   3. Verify:                  docker compose exec hub node /app/dist/cli/smoke.js \
#                                 --http http://127.0.0.1:3000/mcp
#   MCP endpoint:               http://127.0.0.1:${HUB_PORT:-3000}/mcp
#                               (Authorization: Bearer $MCP_AUTH_TOKEN)
#
# The port is published on loopback only; set HUB_BIND=0.0.0.0 to expose it
# on your network (put TLS in front — see docs/deployment/docker.md).
# =============================================================================

name: universal-standard-mcp-server

services:
  hub:
    image: universalstandards/universal-standard-mcp-server:${HUB_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: ${HUB_VERSION:-0.1.0}
    container_name: mcp-hub
    restart: unless-stopped
    ports:
      - "${HUB_BIND:-127.0.0.1}:${HUB_PORT:-3000}:3000"
    # Everything in .env reaches the container, including tool credentials
    # named TOOL_<TOOLNAME>__<VAR> (injected into that tool's process only).
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      MCP_TRANSPORT: http
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set; run scripts/generate-env first}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is not set; run scripts/generate-env first}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN is not set; run scripts/generate-env first}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      REQUIRE_APPROVAL_FOR_HIGH_RISK_ACTIONS: ${REQUIRE_APPROVAL_FOR_HIGH_RISK_ACTIONS:-true}
      AUTO_APPROVE_TOOLS: ${AUTO_APPROVE_TOOLS:-}
      ENABLE_LOCAL_WORKSPACE_SCAN: ${ENABLE_LOCAL_WORKSPACE_SCAN:-false}
    volumes:
      - hub-data:/data
    # Hardening: immutable root filesystem, no privilege escalation, no
    # Linux capabilities. Writable paths: /data (volume), /tmp and the npm
    # cache in $HOME (tmpfs).
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/mcphub:size=1g,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  hub-data:
    name: universal-standard-mcp-data
